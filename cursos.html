<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cursos</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    .curso-card {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      max-width: 400px;
    }

    .curso-titulo {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .btn {
      padding: 8px 12px;
      cursor: pointer;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
    }

    .btn:hover {
      background: #0056b3;
    }
  </style>

</head>
<body>

<div id="loading">Carregando...</div>

<div id="conteudo" style="display:none;">

  <h1>Meus Cursos</h1>
  <p id="user"></p>

  <div class="curso-card">
    <div class="curso-titulo">
      Curso Descomplicando os Cálculos
    </div>

    <button class="btn" id="btnCurso1">
      Acessar curso
    </button>
  </div>

  <br>

  <button class="btn" id="btnLogout">Sair</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDvVYNJS81RkxruoNNX3-ERSOv3MSaEKw",
  authDomain: "anama-5ba78.firebaseapp.com",
  projectId: "anama-5ba78",
  storageBucket: "anama-5ba78.appspot.com",
  messagingSenderId: "641533046699",
  appId: "1:641533046699:web:ac5bbec658bc08395eacee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("conteudo").style.display = "block";

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

});

// eventos (sem onclick)
document.getElementById("btnCurso1")
  .addEventListener("click", () => {
    window.location.href = "curso1.html";
  });

document.getElementById("btnLogout")
  .addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
  });

</script>

</body>
</html>
