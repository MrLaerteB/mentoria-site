<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cursos</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .curso-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .curso-titulo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .curso-descricao {
      color: #555;
      margin-bottom: 15px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      min-height: 40px;
    }
  </style>
</head>

<body>

<div id="loading">Carregando...</div>

<div id="conteudo" style="display:none;" class="container">
  <h1>Meus Cursos</h1>
  <p id="user"></p>
  <div id="listaCursos"></div>
  <button class="btn" id="btnLogout">Sair</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBD...",
  authDomain: "anama-5ba78.firebaseapp.com",
  projectId: "anama-5ba78"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

  try {
    await carregarCursos();

    document.getElementById("loading").style.display = "none";
    document.getElementById("conteudo").style.display = "block";

  } catch (erro) {

    console.error("Erro ao carregar cursos:", erro);

    document.getElementById("loading").innerText =
      "Erro ao carregar cursos. Verifique o console.";

  }

});

async function carregarCursos() {

  const lista = document.getElementById("listaCursos");
  lista.innerHTML = "";

  const snapshot = await getDocs(
    query(collection(db, "cursos"), orderBy("ordem"))
  );

  snapshot.forEach((docSnap) => {

    const curso = docSnap.data();
    const cursoId = docSnap.id;

    const card = document.createElement("div");
    card.className = "curso-card";

    const titulo = document.createElement("div");
    titulo.className = "curso-titulo";
    titulo.innerText = curso.nome || "Sem nome";

    const descricao = document.createElement("div");
    descricao.className = "curso-descricao";
    descricao.innerText = curso.descricao || "";

    const btn = document.createElement("button");
    btn.className = "btn";
    btn.innerText = "Entrar no curso";

    btn.addEventListener("click", () => {
      window.location.href = cursoId + ".html";
    });

    card.appendChild(titulo);
    card.appendChild(descricao);
    card.appendChild(btn);

    lista.appendChild(card);

  });

}

document.getElementById("btnLogout").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "index.html";
});

</script>

</body>
</html>
