<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Cursos</title>
</head>

<body>

<h1>Área de Cursos</h1>
<p id="user"></p>

<div id="listaCursos"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// 🔥 SEU CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBDvVYNJS81RkxruoNNX3-ERSOv3MSaEKw",
  authDomain: "anama-5ba78.firebaseapp.com",
  projectId: "anama-5ba78",
  storageBucket: "anama-5ba78.firebasestorage.app",
  messagingSenderId: "641533046699",
  appId: "1:641533046699:web:ac5bbec658bc08395eacee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 Proteção + carregamento
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

  // 🚀 Buscar cursos
  const querySnapshot = await getDocs(collection(db, "cursos"));

  const lista = document.getElementById("listaCursos");

  querySnapshot.forEach((doc) => {
    const curso = doc.data();

    const div = document.createElement("div");

    div.innerHTML = `
      <h3>${curso.nome}</h3>
      <p>${curso.descricao}</p>
      <button onclick="abrirCurso('${doc.id}')">Entrar</button>
      <hr>
    `;

    lista.appendChild(div);
  });

});

// 👉 ir para página do curso
window.abrirCurso = function(id) {
  window.location.href = "curso1.html?id=" + id;
}

</script>

</body>
</html>
