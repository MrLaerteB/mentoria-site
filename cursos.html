<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cursos</title>
</head>
<body>

<div id="loading">Carregando...</div>

<div id="conteudo" style="display:none;">

  <h1>Meus Cursos</h1>

  <p id="user"></p>

  <button onclick="abrirCurso('curso1')">
    Curso Descomplicando os Cálculos
  </button>

  <br><br>

  <button onclick="logout()">Sair</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDvVYNJS81RkxruoNNX3-ERSOv3MSaEKw",
  authDomain: "anama-5ba78.firebaseapp.com",
  projectId: "anama-5ba78",
  storageBucket: "anama-5ba78.appspot.com",
  messagingSenderId: "641533046699",
  appId: "1:641533046699:web:ac5bbec658bc08395eacee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔐 proteção de rota
onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("conteudo").style.display = "block";

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

});

// ▶ abrir curso
window.abrirCurso = function (cursoId) {
  window.location.href = cursoId + ".html";
};

// 🔴 logout
window.logout = async function () {
  await signOut(auth);
  window.location.href = "index.html";
};

</script>

</body>
</html>
