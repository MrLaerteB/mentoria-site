<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cursos</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .curso-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .btn {
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="loading">Carregando...</div>

<div id="conteudo" style="display:none;" class="container">
  <h1>Meus Cursos</h1>
  <p id="user"></p>
  <div id="listaCursos"></div>
  <button class="btn" id="btnLogout">Sair</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDvVYNJS81RkxruoNNX3-ERSOv3MSaEKw",
  authDomain: "anama-5ba78.firebaseapp.com",
  projectId: "anama-5ba78",
  storageBucket: "anama-5ba78.appspot.com",
  messagingSenderId: "641533046699",
  appId: "1:641533046699:web:ac5bbec658bc08395eacee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {

  console.log("USER:", user);

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

  try {

    const snapshot = await getDocs(
      query(collection(db, "cursos"), orderBy("ordem"))
    );

    document.getElementById("loading").style.display = "none";
    document.getElementById("conteudo").style.display = "block";

    snapshot.forEach((docSnap) => {

      const curso = docSnap.data();
      const cursoId = docSnap.id;

      const div = document.createElement("div");
      div.className = "curso-card";

      div.innerHTML = `
        <h3>${curso.nome}</h3>
        <p>${curso.descricao || ""}</p>
        <button onclick="window.location.href='${cursoId}.html'">
          Entrar
        </button>
      `;

      document.getElementById("listaCursos").appendChild(div);

    });

  } catch (erro) {
    console.error(erro);
    document.getElementById("loading").innerText = "Erro ao carregar cursos";
  }

});

document.getElementById("btnLogout").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "index.html";
});

</script>

</body>
</html>
