<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso</title>

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      background: #f5f5f5;
      margin: 0;
      text-align: left;
    }

    .container {
      max-width: 900px;
      text-align: left;
    }

    #player {
      width: 100%;
      max-width: 600px;
      height: 350px;
      margin-bottom: 15px;
      display: block;
    }

    button.voltar {
      padding: 6px 10px;
      font-size: 14px;
      background: #888;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .aula {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      text-align: left;
    }

    .tituloAula {
      font-size: 18px;
      font-weight: bold;
    }

    .statusAula {
      color: #555;
      margin: 8px 0;
    }

    .aula button {
      padding: 6px 10px;
      font-size: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <button class="voltar" onclick="window.location.href='anama.html'">← Voltar</button>
  <h1 id="tituloCurso">Curso</h1>
  <p id="user"></p>
  <iframe id="player" allowfullscreen></iframe>
  <h3 id="progressoTexto"></h3>
  <div id="listaAulas"></div>
</div>

<script type="module">

import { auth, db, onAuthStateChanged } from "./firebase.js";
import { doc, getDoc, collection, getDocs, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// pega o ID do curso da URL
const urlParams = new URLSearchParams(window.location.search);
const cursoId = urlParams.get('id');

let timeoutRedirect;

onAuthStateChanged(auth, async (user) => {
  if (user) {
    clearTimeout(timeoutRedirect);
    document.getElementById("user").innerText = "Logado como: " + user.email;
    await carregarNomeCurso(user);
  } else {
    timeoutRedirect = setTimeout(() => {
      if (!auth.currentUser) {
        window.location.href = "index.html";
      }
    }, 3000);
  }
});

async function carregarNomeCurso(user) {
  const cursoRef = doc(db, "cursos", cursoId);
  const cursoSnap = await getDoc(cursoRef);

  if (cursoSnap.exists()) {
    const dataCurso = cursoSnap.data();
    const nomeCurso = dataCurso.nome || "Curso";
    const classeCurso = dataCurso.classe || "padrao";

    document.title = nomeCurso;
    document.getElementById("tituloCurso").innerText = nomeCurso;

    if (classeCurso === "videos") {
      await carregarAulas(user);
    } else {
      document.getElementById("listaAulas").innerHTML = 
        "<p>Este curso ainda não possui template definido.</p>";
      document.getElementById("player").style.display = "none";
      document.getElementById("progressoTexto").style.display = "none";
    }
  } else {
    document.getElementById("listaAulas").innerHTML = 
      "<p>Curso não encontrado.</p>";
    document.getElementById("player").style.display = "none";
    document.getElementById("progressoTexto").style.display = "none";
  }
}

async function carregarAulas(user) {
  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";

  const snapshot = await getDocs(query(collection(db, "cursos", cursoId, "aulas"), orderBy("ordem")));

  let total = 0;
  let assistidas = 0;
  let primeiraAula = null;

  for (const docSnap of snapshot.docs) {
    const aula = docSnap.data();
    const aulaId = docSnap.id;

    if (!primeiraAula) primeiraAula = aula;
    total++;

    const progressoRef = doc(db, "progresso", user.uid, "cursos", cursoId, "aulas", aulaId);
    const progressoSnap = await getDoc(progressoRef);
    const assistido = progressoSnap.exists();
    if (assistido) assistidas++;

    const div = document.createElement("div");
    div.className = "aula";

    const statusTexto = assistido ? "✔ Assistido" : "❌ Não assistido";

    div.innerHTML = `
      <div class="tituloAula">${aula.titulo}</div>
      <div class="statusAula">${statusTexto}</div>
      <button>Assistir</button>
    `;

    const btn = div.querySelector("button");
    btn.addEventListener("click", async () => {
      document.getElementById("player").src = `https://www.youtube.com/embed/${aula.videoId}`;
      await setDoc(progressoRef, { assistido: true });
      div.querySelector(".statusAula").innerText = "✔ Assistido";
      assistidas++;
      document.getElementById("progressoTexto").innerText = `Progresso: ${assistidas} / ${total}`;
    });

    lista.appendChild(div);
  }

  if (primeiraAula) {
    document.getElementById("player").src = `https://www.youtube.com/embed/${primeiraAula.videoId}`;
  }

  document.getElementById("progressoTexto").innerText = `Progresso: ${assistidas} / ${total}`;
}

</script>

</body>
</html>
