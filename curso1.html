<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Curso</title>
</head>

<body>

<div id="loading" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:white;
z-index:999;
">
Carregando...
</div>

<div id="conteudo" style="display:none;">

<button onclick="voltarMenu()">⬅ Voltar</button>

<h1>Curso</h1>
<p id="user"></p>

<iframe id="player" width="800" height="450"></iframe>

<div id="listaAulas"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// ✅ MESMA CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBDvVYNJS81RkxruoNNX3-ERSOv3MSaEKw",
  authDomain: "anama-5ba78.firebaseapp.com",
  projectId: "anama-5ba78",
  storageBucket: "anama-5ba78.appspot.com",
  messagingSenderId: "641533046699",
  appId: "1:641533046699:web:ac5bbec658bc08395eacee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const cursoId = "curso1";

// 🔐 PROTEÇÃO
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("conteudo").style.display = "block";

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

  carregarCurso(user);

});

async function carregarCurso(user) {

  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";

  const progressoSnap = await getDoc(doc(db, "progresso", user.uid));
  let progresso = progressoSnap.exists() ? progressoSnap.data() : {};

  const snapshot = await getDocs(
    query(collection(db, "cursos", cursoId, "aulas"), orderBy("ordem"))
  );

  let primeira = true;

  snapshot.forEach((docSnap) => {

    const aula = docSnap.data();
    const aulaId = docSnap.id;

    const videoId = aula.videoId || aula.videoID;

    const btn = document.createElement("button");
    btn.innerText = aula.titulo;

    btn.onclick = () => trocarVideo(videoId, aulaId);

    lista.appendChild(btn);
    lista.appendChild(document.createElement("br"));

    if (primeira && videoId) {
      document.getElementById("player").src =
        "https://www.youtube.com/embed/" + videoId;
      primeira = false;
    }

  });

}

async function trocarVideo(videoId, aulaId) {

  document.getElementById("player").src =
    "https://www.youtube.com/embed/" + videoId;

  const user = auth.currentUser;
  if (!user) return;

  await setDoc(doc(db, "progresso", user.uid), {
    [cursoId + "_" + aulaId]: true
  }, { merge: true });

}

function voltarMenu() {
  window.location.href = "index.html";
}

</script>

</body>
</html>
