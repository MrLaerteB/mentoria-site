<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso</title>
</head>

<body>

<h1 id="tituloCurso"></h1>
<p id="user"></p>

<iframe id="player" width="600" height="350" allowfullscreen></iframe>

<h3 id="progressoTexto"></h3>

<div id="listaAulas"></div>

<script type="module">

import { auth, db, onAuthStateChanged } from "./firebase.js";

import {
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  orderBy,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const cursoId = "curso1"; // 🔥 depois podemos dinamizar isso

let timeoutRedirect;

onAuthStateChanged(auth, async (user) => {

  if (user) {

    clearTimeout(timeoutRedirect);

    document.getElementById("user").innerText =
      "Logado como: " + user.email;

    await carregarCurso();
    await carregarAulas(user);

  } else {

    timeoutRedirect = setTimeout(() => {
      if (!auth.currentUser) {
        window.location.href = "index.html";
      }
    }, 3000);

  }

});

async function carregarCurso() {

  const docRef = doc(db, "cursos", cursoId);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {
    document.getElementById("tituloCurso").innerText =
      docSnap.data().nome;
  }

}

async function carregarAulas(user) {

  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";

  const snapshot = await getDocs(
    query(collection(db, "cursos", cursoId, "aulas"), orderBy("ordem"))
  );

  let total = 0;
  let assistidas = 0;

  for (const docSnap of snapshot.docs) {

    const aula = docSnap.data();
    const aulaId = docSnap.id;

    total++;

    // 🔥 progresso do usuário
    const progressoRef = doc(db, "progresso", user.uid, "cursos", cursoId, "aulas", aulaId);
    const progressoSnap = await getDoc(progressoRef);

    const assistido = progressoSnap.exists();

    if (assistido) assistidas++;

    const div = document.createElement("div");

    div.innerHTML = `
      <strong>${aula.titulo}</strong>
      <br>
      Status: ${assistido ? "✔ Assistido" : "❌ Não assistido"}
      <br>
      <button>Assistir</button>
      <hr>
    `;

    const btn = div.querySelector("button");

    btn.addEventListener("click", async () => {

      // carrega vídeo
      document.getElementById("player").src =
        `https://www.youtube.com/embed/${aula.videoId}`;

      // salva progresso
      await setDoc(progressoRef, {
        assistido: true
      });

      // atualiza status visual
      div.innerHTML = `
        <strong>${aula.titulo}</strong>
        <br>
        Status: ✔ Assistido
        <br>
        <button>Assistir</button>
        <hr>
      `;

    });

    lista.appendChild(div);

  }

  document.getElementById("progressoTexto").innerText =
    `Progresso: ${assistidas} / ${total}`;

}

</script>

</body>
</html>
