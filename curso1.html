<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso 1</title>
</head>

<body>

<h1>Curso 1</h1>
<p id="user"></p>

<!-- 🔥 PLAYER (isso que faltava) -->
<iframe id="player" width="600" height="350" allowfullscreen></iframe>

<div id="listaAulas"></div>

<script type="module">

import { auth, db, onAuthStateChanged } from "./firebase.js";

import {
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

let timeoutRedirect;

onAuthStateChanged(auth, async (user) => {

  if (user) {

    clearTimeout(timeoutRedirect);

    document.getElementById("user").innerText = user.email;

    carregarAulas();

  } else {

    timeoutRedirect = setTimeout(() => {
      if (!auth.currentUser) {
        window.location.href = "index.html";
      }
    }, 3000);

  }

});

async function carregarAulas() {

  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";

  const snapshot = await getDocs(
    query(collection(db, "cursos", "curso1", "aulas"), orderBy("ordem"))
  );

  snapshot.forEach(doc => {

    const aula = doc.data();

    const div = document.createElement("div");

    div.innerText = aula.titulo;

    // 🔥 ESSENCIAL: clique carrega vídeo
    div.addEventListener("click", () => {
      carregarVideo(aula.videoId);
    });

    lista.appendChild(div);

  });

}

function carregarVideo(videoId) {

  const iframe = document.getElementById("player");

  iframe.src = `https://www.youtube.com/embed/${videoId}`;

}

</script>

</body>
</html>
