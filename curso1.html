<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Curso "Descomplicando os Cálculos"</title>
</head>

<body>

<!-- 🔄 LOADING -->
<div id="loading" style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  background:white;
  z-index:999;
">
Carregando...
</div>

<!-- 🔒 CONTEÚDO PROTEGIDO -->
<div id="conteudo" style="display:none;">

  <!-- 🔙 VOLTAR -->
  <button onclick="voltarMenu()" style="
    padding:10px 15px;
    margin-bottom:15px;
    cursor:pointer;
  ">
  ⬅ Voltar ao menu
  </button>

  <h1>Curso "Descomplicando os Cálculos"</h1>

  <p id="user"></p>
  <h3 id="progressoTexto"></h3>

  <!-- 🎬 PLAYER -->
  <iframe 
    id="player"
    width="800"
    height="450"
    src=""
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <h2>Aulas</h2>
  <div id="listaAulas"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// 🔧 CONFIG
const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "SEU_DOMINIO",
  projectId: "SEU_PROJECT_ID",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const cursoId = "curso1";

let total = 0;
let assistidas = 0;

// 🔐 AUTH PROFISSIONAL
onAuthStateChanged(auth, async (user) => {

  const loading = document.getElementById("loading");
  const conteudo = document.getElementById("conteudo");

  // ⏳ ainda carregando estado → não decide nada
  if (user === undefined) return;

  // ❌ não logado
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  // ✅ liberado
  loading.style.display = "none";
  conteudo.style.display = "block";

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

  await carregarCurso(user);

});

// 📚 CARREGAR CURSO
async function carregarCurso(user) {

  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";

  let progresso = {};

  const progressoRef = doc(db, "progresso", user.uid);
  const progressoSnap = await getDoc(progressoRef);

  if (progressoSnap.exists()) {
    progresso = progressoSnap.data();
  }

  const aulasRef = collection(db, "cursos", cursoId, "aulas");
  const q = query(aulasRef, orderBy("ordem"));
  const snapshot = await getDocs(q);

  total = 0;
  assistidas = 0;

  let primeiraAula = true;

  snapshot.forEach((docSnap) => {

    total++;

    const aula = docSnap.data();
    const aulaId = docSnap.id;

    // 🔒 tolerância a erro de banco
    const videoId = aula.videoId || aula.videoID;

    const assistida = progresso[cursoId + "_" + aulaId];
    if (assistida) assistidas++;

    const div = document.createElement("div");

    const button = document.createElement("button");
    button.innerText = aula.titulo;

    button.onclick = () => trocarVideo(videoId, aulaId);

    const check = document.createElement("span");
    check.id = "check-" + aulaId;
    check.innerText = assistida ? "✅" : "";

    div.appendChild(button);
    div.appendChild(check);
    div.appendChild(document.createElement("br"));
    div.appendChild(document.createElement("br"));

    lista.appendChild(div);

    // ▶️ primeira aula automática
    if (primeiraAula && videoId) {
      document.getElementById("player").src =
        getEmbedUrl(videoId);
      primeiraAula = false;
    }

  });

  atualizarProgresso();

}

// 🔗 URL segura do YouTube
function getEmbedUrl(videoId) {

  if (!videoId) return "";

  // se vier URL completa
  if (videoId.includes("youtube.com")) {
    const match = videoId.match(/v=([^&]+)/);
    if (match) videoId = match[1];
  }

  return "https://www.youtube.com/embed/" + videoId;
}

// 📊 progresso
function atualizarProgresso() {

  let porcentagem = 0;

  if (total > 0) {
    porcentagem = Math.round((assistidas / total) * 100);
  }

  document.getElementById("progressoTexto").innerText =
    "Progresso: " + porcentagem + "%";

}

// 🎬 trocar vídeo
async function trocarVideo(videoId, aulaId) {

  const player = document.getElementById("player");

  if (!player) {
    console.error("Player não encontrado");
    return;
  }

  player.src = getEmbedUrl(videoId);

  const user = auth.currentUser;
  if (!user) return;

  const ref = doc(db, "progresso", user.uid);

  await setDoc(ref, {
    [cursoId + "_" + aulaId]: true
  }, { merge: true });

  const check = document.getElementById("check-" + aulaId);

  if (check.innerText !== "✅") {
    check.innerText = "✅";
    assistidas++;
    atualizarProgresso();
  }

}

// 🔙 voltar
function voltarMenu() {

  if (document.referrer) {
    window.history.back();
  } else {
    window.location.href = "index.html";
  }

}

</script>

</body>
</html>
