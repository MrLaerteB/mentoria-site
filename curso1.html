<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Curso</title>
</head>

<body>

<!-- LOADING -->
<div id="loading" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:white;
z-index:999;
">
Carregando...
</div>

<!-- CONTEÚDO -->
<div id="conteudo" style="display:none;">

<button onclick="voltarMenu()">⬅ Voltar</button>

<h1>Curso</h1>

<p id="user"></p>
<h3 id="progressoTexto"></h3>

<iframe id="player" width="800" height="450"></iframe>

<div id="listaAulas"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "SEU_DOMINIO",
  projectId: "SEU_PROJECT_ID",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const cursoId = "curso1";

let total = 0;
let assistidas = 0;

// 🔐 AUTH CORRETO
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("conteudo").style.display = "block";

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

  carregarCurso(user);

});

async function carregarCurso(user) {

  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";

  let progresso = {};

  const progressoSnap = await getDoc(doc(db, "progresso", user.uid));

  if (progressoSnap.exists()) {
    progresso = progressoSnap.data();
  }

  const snapshot = await getDocs(
    query(collection(db, "cursos", cursoId, "aulas"), orderBy("ordem"))
  );

  let primeiraAula = true;

  snapshot.forEach((docSnap) => {

    total++;

    const aula = docSnap.data();
    const aulaId = docSnap.id;

    const videoId = aula.videoId || aula.videoID;

    const div = document.createElement("div");

    const btn = document.createElement("button");
    btn.innerText = aula.titulo;

    btn.onclick = () => trocarVideo(videoId, aulaId);

    div.appendChild(btn);
    lista.appendChild(div);

    if (primeiraAula && videoId) {
      document.getElementById("player").src =
        "https://www.youtube.com/embed/" + videoId;
      primeiraAula = false;
    }

  });

}

async function trocarVideo(videoId, aulaId) {

  document.getElementById("player").src =
    "https://www.youtube.com/embed/" + videoId;

  const user = auth.currentUser;
  if (!user) return;

  await setDoc(doc(db, "progresso", user.uid), {
    [cursoId + "_" + aulaId]: true
  }, { merge: true });

}

function voltarMenu() {
  window.location.href = "index.html";
}

</script>

</body>
</html>
