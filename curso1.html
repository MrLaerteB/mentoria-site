<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Curso</title>
</head>

<body>

<div id="loading" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:white;
z-index:999;
">
Carregando...
</div>

<div id="conteudo" style="display:none;">

<button onclick="voltar()">⬅ Voltar</button>

<h1>Curso Descomplicando os Cálculos</h1>

<p id="user"></p>
<h3 id="progressoTexto"></h3>

<iframe id="player" width="800" height="450"></iframe>

<h2>Aulas</h2>
<div id="listaAulas"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDvVYNJS81RkxruoNNX3-ERSOv3MSaEKw",
  authDomain: "anama-5ba78.firebaseapp.com",
  projectId: "anama-5ba78",
  storageBucket: "anama-5ba78.appspot.com",
  messagingSenderId: "641533046699",
  appId: "1:641533046699:web:ac5bbec658bc08395eacee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const cursoId = "curso1";

let total = 0;
let assistidas = 0;

// 🔐 proteção
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("conteudo").style.display = "block";

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

  carregarCurso(user);

});

// 📚 carregar curso
async function carregarCurso(user) {

  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";

  let progresso = {};

  const progressoSnap = await getDoc(doc(db, "progresso", user.uid));

  if (progressoSnap.exists()) {
    progresso = progressoSnap.data();
  }

  const snapshot = await getDocs(
    query(collection(db, "cursos", cursoId, "aulas"), orderBy("ordem"))
  );

  total = 0;
  assistidas = 0;

  let primeira = true;

  snapshot.forEach((docSnap) => {

    total++;

    const aula = docSnap.data();
    const aulaId = docSnap.id;

    const videoId = aula.videoId || aula.videoID;

    const assistida = progresso[cursoId + "_" + aulaId];
    if (assistida) assistidas++;

    const div = document.createElement("div");

    const btn = document.createElement("button");
    btn.innerText = aula.titulo;

    btn.onclick = () => trocarVideo(videoId, aulaId);

    const check = document.createElement("span");
    check.innerText = assistida ? " ✅" : "";

    div.appendChild(btn);
    div.appendChild(check);

    lista.appendChild(div);
    lista.appendChild(document.createElement("br"));

    if (primeira && videoId) {
      document.getElementById("player").src =
        "https://www.youtube.com/embed/" + videoId;
      primeira = false;
    }

  });

  atualizarProgresso();

}

// ▶ trocar vídeo
async function trocarVideo(videoId, aulaId) {

  document.getElementById("player").src =
    "https://www.youtube.com/embed/" + videoId;

  const user = auth.currentUser;
  if (!user) return;

  await setDoc(doc(db, "progresso", user.uid), {
    [cursoId + "_" + aulaId]: true
  }, { merge: true });

  assistidas++;
  atualizarProgresso();

}

// 📊 progresso
function atualizarProgresso() {

  let porcentagem = 0;

  if (total > 0) {
    porcentagem = Math.round((assistidas / total) * 100);
  }

  document.getElementById("progressoTexto").innerText =
    "Progresso: " + porcentagem + "%";

}

// 🔙 voltar
window.voltar = function () {
  window.location.href = "cursos.html";
};

</script>

</body>
</html>
