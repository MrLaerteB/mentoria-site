<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Curso "Descomplicando os Cálculos"</title>
</head>

<body>

<h1>Curso "Descomplicando os Cálculos"</h1>

<p id="user"></p>
<h3 id="progressoTexto"></h3>

<!-- PLAYER ÚNICO E CORRETO -->
<iframe 
  id="player"
  width="800"
  height="450"
  src=""
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
  allowfullscreen>
</iframe>

<h2>Aulas</h2>
<div id="listaAulas"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "SEU_DOMINIO",
  projectId: "SEU_PROJECT_ID",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const cursoId = "curso1";

let total = 0;
let assistidas = 0;

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";

  let progresso = {};

  const progressoRef = doc(db, "progresso", user.uid);
  const progressoSnap = await getDoc(progressoRef);

  if (progressoSnap.exists()) {
    progresso = progressoSnap.data();
  }

  const aulasRef = collection(db, "cursos", cursoId, "aulas");
  const q = query(aulasRef, orderBy("ordem"));

  const snapshot = await getDocs(q);

  total = 0;
  assistidas = 0;

  let primeiraAula = true;

  snapshot.forEach((docSnap) => {

    total++;

    const aula = docSnap.data();
    const aulaId = docSnap.id;

    const assistida = progresso[cursoId + "_" + aulaId];

    if (assistida) assistidas++;

    const div = document.createElement("div");

    const button = document.createElement("button");
    button.innerText = aula.titulo;

    button.addEventListener("click", () => {
      trocarVideo(aula.videoId, aulaId);
    });

    const check = document.createElement("span");
    check.id = "check-" + aulaId;
    check.innerText = assistida ? "✅" : "";

    div.appendChild(button);
    div.appendChild(check);
    div.appendChild(document.createElement("br"));
    div.appendChild(document.createElement("br"));

    lista.appendChild(div);

    // 🔥 PRIMEIRA AULA AUTOMÁTICA (corrigido e seguro)
    if (primeiraAula && aula.videoId) {

      const player = document.getElementById("player");

      if (player) {
        player.src = getEmbedUrl(aula.videoId);
        primeiraAula = false;
      }

    }

  });

  atualizarProgresso();

});

// 🔥 CENTRALIZA A URL (evita erro futuro)
function getEmbedUrl(videoId) {

  // proteção contra erro de banco
  if (!videoId) return "";

  // remove caso alguém salve URL completa
  if (videoId.includes("youtube.com")) {
    const match = videoId.match(/v=([^&]+)/);
    if (match) videoId = match[1];
  }

  return "https://www.youtube.com/embed/" + videoId;
}

function atualizarProgresso() {

  let porcentagem = 0;

  if (total > 0) {
    porcentagem = Math.round((assistidas / total) * 100);
  }

  document.getElementById("progressoTexto").innerText =
    "Progresso: " + porcentagem + "%";

}

async function trocarVideo(videoId, aulaId) {

  const player = document.getElementById("player");

  if (!player) {
    console.error("Player não encontrado");
    return;
  }

  player.src = getEmbedUrl(videoId);

  const user = auth.currentUser;
  if (!user) return;

  const ref = doc(db, "progresso", user.uid);

  await setDoc(ref, {
    [cursoId + "_" + aulaId]: true
  }, { merge: true });

  const check = document.getElementById("check-" + aulaId);

  if (check.innerText !== "✅") {
    check.innerText = "✅";
    assistidas++;
    atualizarProgresso();
  }

}

</script>

</body>
</html>
