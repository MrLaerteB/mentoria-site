<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #120532;
    color: white;
    margin: 0;
    padding: 10px;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 10px 15px;
  }

  .topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  #voltar {
    padding: 5px 10px;
    font-size: 13px;
    font-weight: bold;
    background: #06faa4;
    color: #120532;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }

  #voltar:hover {
    background: #05e295;
    transform: translateY(-1px);
  }

  #user {
    font-size: 12px;
    font-style: italic;
    color: #ccc;
    text-align: right;
    word-break: break-word;
    max-width: 60%;
  }

  h1#tituloCurso {
    color: #06faa4;
    font-weight: bold;
    margin-bottom: 10px;
    font-size: clamp(20px, 5vw, 28px);
    line-height: 1.2;
    word-break: break-word;
  }

  .modulo-container {
    display: none;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    position: relative;
  }

  #tituloModulo {
    color: #06faa4;
    font-weight: bold;
    font-size: 16px;
  }

  /* BOTÃO DROPDOWN */
  #btnModulo {
    padding: 6px 12px;
    font-size: 13px;
    font-weight: bold;
    background: #06faa4;
    color: #120532;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  #btnModulo:hover {
    background: #05e295;
  }

  /* MENU */
  #menuModulo {
    display: none;
    position: absolute;
    right: 0;
    top: 35px;
    background: #1b074d;
    border-radius: 8px;
    overflow: hidden;
    z-index: 10;
    min-width: 180px;
  }

  .itemModulo {
    padding: 10px;
    cursor: pointer;
    border-bottom: 1px solid #2a0d6b;
  }

  .itemModulo:hover {
    background: #2a0d6b;
  }

  iframe#player {
    width: 100%;
    height: 220px;
    margin-bottom: 15px;
    border: none;
    border-radius: 10px;
  }

  #progressoTexto {
    color: #06faa4;
    margin-bottom: 15px;
  }

  .aula {
    background: #1b074d;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
  }

  .tituloAula {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 5px;
  }

  .status {
    margin-bottom: 10px;
    color: #ccc;
  }

  button.assistir {
    padding: 6px 10px;
    font-size: 14px;
    font-weight: bold;
    background: #06faa4;
    color: #120532;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
  }

  button.assistir:hover {
    background: #05e295;
  }

  @media (min-width: 600px) {
    iframe#player {
      height: 350px;
    }
  }
</style>
</head>

<body>

<div class="container">

  <div class="topo">
    <button id="voltar">Voltar</button>
    <p id="user"></p>
  </div>

  <h1 id="tituloCurso">Curso</h1>

  <div class="modulo-container" id="moduloContainer">
    <div id="tituloModulo"></div>
    <button id="btnModulo">Trocar módulo</button>
    <div id="menuModulo"></div>
  </div>

  <iframe id="player" allowfullscreen></iframe>
  <h3 id="progressoTexto"></h3>
  <div id="listaAulas"></div>
</div>

<script type="module">
import { auth, db, onAuthStateChanged } from "./firebase.js";
import { doc, getDoc, collection, getDocs, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const cursoId = new URLSearchParams(window.location.search).get("id") || "curso1";

let todasAulas = [];
let moduloAtual = null;
let nomeModuloMap = {};
let userGlobal = null;

const moduloContainer = document.getElementById("moduloContainer");
const menuModulo = document.getElementById("menuModulo");
const btnModulo = document.getElementById("btnModulo");

onAuthStateChanged(auth, async (user) => {
  if (user) {
    userGlobal = user;
    document.getElementById("user").innerText = "Logado como:\n" + user.email;
    await carregarNomeCurso();
    await carregarAulas(user);
  } else {
    setTimeout(() => {
      if (!auth.currentUser) window.location.href = "index.html";
    }, 3000);
  }
});

document.getElementById("voltar").onclick = () => {
  window.location.href = "anama.html";
};

btnModulo.onclick = () => {
  menuModulo.style.display = menuModulo.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
  if (!btnModulo.contains(e.target) && !menuModulo.contains(e.target)) {
    menuModulo.style.display = "none";
  }
});

async function carregarNomeCurso() {
  const snap = await getDoc(doc(db, "cursos", cursoId));
  if (snap.exists()) {
    const nome = snap.data().nome || "Curso";
    document.title = nome;
    document.getElementById("tituloCurso").innerText = nome;
  }
}

async function carregarAulas(user) {
  const snapshot = await getDocs(query(collection(db, "cursos", cursoId, "aulas"), orderBy("ordem")));

  todasAulas = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

  nomeModuloMap = {};

  for (const aula of todasAulas) {
    if (aula.modulo !== undefined && aula.nomeModulo) {
      if (!nomeModuloMap[aula.modulo]) {
        nomeModuloMap[aula.modulo] = aula.nomeModulo;
      }
    }
  }

  const modulos = Object.keys(nomeModuloMap).sort((a,b)=>a-b);

  if (modulos.length <= 1) {
    moduloContainer.style.display = "none";
    moduloAtual = modulos[0] || null;
    renderAulas(user);
    return;
  }

  moduloContainer.style.display = "flex";

  menuModulo.innerHTML = "";

  modulos.forEach(mod => {
    const div = document.createElement("div");
    div.className = "itemModulo";
    div.innerText = nomeModuloMap[mod];

    div.onclick = () => {
      moduloAtual = mod;
      localStorage.setItem("modulo_" + cursoId, mod);
      menuModulo.style.display = "none";
      renderAulas(userGlobal);
    };

    menuModulo.appendChild(div);
  });

  const salvo = localStorage.getItem("modulo_" + cursoId);
  moduloAtual = modulos.includes(salvo) ? salvo : modulos[0];

  renderAulas(user);
}

async function renderAulas(user) {
  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";

  if (moduloAtual !== null) {
    document.getElementById("tituloModulo").innerText = nomeModuloMap[moduloAtual];
  }

  let total = 0;
  let assistidas = 0;
  let primeira = null;

  const aulas = moduloAtual === null
    ? todasAulas
    : todasAulas.filter(a => a.modulo == moduloAtual);

  aulas.sort((a,b)=>a.ordem-b.ordem);

  for (const aula of aulas) {
    if (!primeira) primeira = aula;
    total++;

    const progressoRef = doc(db, "progresso", user.uid, "cursos", cursoId, "aulas", aula.id);
    const snap = await getDoc(progressoRef);
    const assistido = snap.exists();
    if (assistido) assistidas++;

    const div = document.createElement("div");
    div.className = "aula";

    div.innerHTML = `
      <div class="tituloAula">${aula.titulo}</div>
      <div class="status">${assistido ? "✔ Assistido" : "❌ Não assistido"}</div>
      <button class="assistir">Assistir</button>
    `;

    div.querySelector("button").onclick = async () => {
      document.getElementById("player").src = `https://www.youtube.com/embed/${aula.videoId}`;
      await setDoc(progressoRef, { assistido: true });
      div.querySelector(".status").innerText = "✔ Assistido";
    };

    lista.appendChild(div);
  }

  if (primeira) {
    document.getElementById("player").src = `https://www.youtube.com/embed/${primeira.videoId}`;
  }

  document.getElementById("progressoTexto").innerText = `Progresso: ${assistidas} / ${total}`;
}
</script>

</body>
</html>
