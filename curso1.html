<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #120532;
    color: white;
    margin: 0;
    padding: 10px;
    text-align: left;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 10px 15px;
    text-align: left;
  }

  #voltar {
    padding: 6px 12px;
    font-size: 14px;
    font-weight: bold;
    background: #06faa4;
    color: #120532;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 15px;
  }

  #voltar:hover {
    background: #05e295;
    transform: translateY(-1px);
  }

  h1#tituloCurso {
    color: #06faa4;
    font-weight: bold;
    margin-bottom: 15px;
  }

  .aula {
    background: #1b074d;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
  }

  .tituloAula {
    font-size: clamp(18px, 4vw, 20px);
    font-weight: bold;
    color: white;
    margin-bottom: 5px;
  }

  .status {
    margin-bottom: 10px;
    color: #ccc;
  }

  button.assistir {
    padding: 4px 8px;
    font-size: 14px;
    font-weight: bold;
    background: #06faa4;
    color: #120532;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }

  button.assistir:hover {
    background: #05e295;
    transform: translateY(-1px);
  }

  iframe#player {
    width: 100%;
    height: 350px;
    margin-bottom: 15px;
    border: none;
    border-radius: 10px;
  }

  #progressoTexto {
    color: #06faa4;
    margin-bottom: 15px;
  }

  @media (max-width: 480px) {
    iframe#player { height: 220px; }
    button.assistir { width: 100%; font-size: 16px; }
    #voltar { width: 100%; font-size: 16px; }
  }
</style>
</head>

<body>

<div class="container">
  <button id="voltar">Voltar</button>
  <h1 id="tituloCurso">Curso</h1>
  <p id="user"></p>
  <iframe id="player" allowfullscreen></iframe>
  <h3 id="progressoTexto"></h3>
  <div id="listaAulas"></div>
</div>

<script type="module">
import { auth, db, onAuthStateChanged } from "./firebase.js";
import { doc, getDoc, collection, getDocs, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const urlParams = new URLSearchParams(window.location.search);
const cursoId = urlParams.get("id") || "curso1";

let timeoutRedirect;

onAuthStateChanged(auth, async (user) => {
  if (user) {
    clearTimeout(timeoutRedirect);
    document.getElementById("user").innerText = "Logado como: " + user.email;
    await carregarNomeCurso();
    await carregarAulas(user);
  } else {
    timeoutRedirect = setTimeout(() => {
      if (!auth.currentUser) window.location.href = "index.html";
    }, 3000);
  }
});

document.getElementById("voltar").addEventListener("click", () => {
  window.location.href = "anama.html";
});

async function carregarNomeCurso() {
  const cursoRef = doc(db, "cursos", cursoId);
  const cursoSnap = await getDoc(cursoRef);
  if (cursoSnap.exists()) {
    const nomeCurso = cursoSnap.data().nome || "Curso";
    document.title = nomeCurso;
    document.getElementById("tituloCurso").innerText = nomeCurso;
  }
}

async function carregarAulas(user) {
  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";
  const snapshot = await getDocs(query(collection(db, "cursos", cursoId, "aulas"), orderBy("ordem")));
  let total = 0;
  let assistidas = 0;
  let primeiraAula = null;

  for (const docSnap of snapshot.docs) {
    const aula = docSnap.data();
    const aulaId = docSnap.id;

    if (!primeiraAula) primeiraAula = aula;
    total++;

    const progressoRef = doc(db, "progresso", user.uid, "cursos", cursoId, "aulas", aulaId);
    const progressoSnap = await getDoc(progressoRef);
    const assistido = progressoSnap.exists();
    if (assistido) assistidas++;

    const div = document.createElement("div");
    div.className = "aula";

    div.innerHTML = `
      <div class="tituloAula">${aula.titulo}</div>
      <div class="status">${assistido ? "✔ Assistido" : "❌ Não assistido"}</div>
      <button class="assistir">Assistir</button>
    `;

    const btn = div.querySelector("button.assistir");
    btn.addEventListener("click", async () => {
      document.getElementById("player").src = `https://www.youtube.com/embed/${aula.videoId}`;
      await setDoc(progressoRef, { assistido: true });
      div.querySelector(".status").innerText = "✔ Assistido";
      assistidas++;
      document.getElementById("progressoTexto").innerText = `Progresso: ${assistidas} / ${total}`;
    });

    lista.appendChild(div);
  }

  if (primeiraAula) {
    document.getElementById("player").src = `https://www.youtube.com/embed/${primeiraAula.videoId}`;
  }
  document.getElementById("progressoTexto").innerText = `Progresso: ${assistidas} / ${total}`;
}
</script>

</body>
</html>
