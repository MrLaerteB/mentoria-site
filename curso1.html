<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Curso</title>

  <style> /* */
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    .container {
      max-width: 900px;
    }

    .btn {
      padding: 8px 14px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn:hover {
      background: #0056b3;
    }

    .aula {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      height: 50px;
      max-width: 600px;
    }

    .aula-titulo {
      flex: 1;
    }

    .aula button {
      background: #28a745;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .check {
      margin-left: 10px;
    }
  </style>

</head>

<body>

<div id="loading">Carregando...</div>

<div id="conteudo" style="display:none;" class="container">

<button class="btn" id="btnVoltar">⬅ Voltar</button>

<h1 id="tituloCurso"></h1>

<p id="user"></p>

<iframe 
  id="player"
  width="100%" 
  height="450"
  frameborder="0"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
  allowfullscreen>
</iframe>

<h2>Aulas</h2>
<div id="listaAulas"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDvVYNJS81RkxruoNNX3-ERSOv3MSaEKw",
  authDomain: "anama-5ba78.firebaseapp.com",
  projectId: "anama-5ba78",
  storageBucket: "anama-5ba78.appspot.com",
  messagingSenderId: "641533046699",
  appId: "1:641533046699:web:ac5bbec658bc08395eacee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const cursoId = "curso1";

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("conteudo").style.display = "block";

  document.getElementById("user").innerText =
    "Logado como: " + user.email;

  // 🔥 PUXA NOME DO CURSO
  const cursoSnap = await getDoc(doc(db, "cursos", cursoId));

  if (cursoSnap.exists()) {
    const cursoData = cursoSnap.data();
    document.getElementById("tituloCurso").innerText =
      cursoData.nome || "Curso";
  }

  carregarAulas(user);

});

async function carregarAulas(user) {

  const lista = document.getElementById("listaAulas");
  lista.innerHTML = "";

  const progressoSnap = await getDoc(doc(db, "progresso", user.uid));
  let progresso = progressoSnap.exists() ? progressoSnap.data() : {};

  const snapshot = await getDocs(
    query(collection(db, "cursos", cursoId, "aulas"), orderBy("ordem"))
  );

  let primeira = true;

  snapshot.forEach((docSnap) => {

    const aula = docSnap.data();
    const aulaId = docSnap.id;
    const videoId = aula.videoId || aula.videoID;

    const div = document.createElement("div");
    div.className = "aula";

    const titulo = document.createElement("div");
    titulo.className = "aula-titulo";
    titulo.innerText = aula.titulo;

    const btn = document.createElement("button");
    btn.innerText = "Assistir";

    btn.addEventListener("click", () => {
      trocarVideo(videoId, aulaId);
    });

    const check = document.createElement("span");
    check.className = "check";
    check.innerText = progresso[cursoId + "_" + aulaId] ? "✅" : "";

    div.appendChild(titulo);
    div.appendChild(btn);
    div.appendChild(check);

    lista.appendChild(div);

    if (primeira && videoId) {
      document.getElementById("player").src =
  "https://www.youtube.com/embed/" + videoId + "?rel=0&modestbranding=1";
      primeira = false;
    }

  });

}

async function trocarVideo(videoId, aulaId) {

  document.getElementById("player").src =
    "https://www.youtube.com/embed/" + videoId;

  const user = auth.currentUser;
  if (!user) return;

  await setDoc(doc(db, "progresso", user.uid), {
    [cursoId + "_" + aulaId]: true
  }, { merge: true });

}

// 🔙 VOLTAR
document.getElementById("btnVoltar").addEventListener("click", () => {
  window.location.href = "cursos.html";
});

</script>

</body>
</html>
