<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANAMÁ TRADING</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #120532; /* fundo do logo */
    color: white;
    margin: 0;
    padding: 10px;
    text-align: left;
  }

  .container {
    max-width: 900px;
    margin: auto;
    text-align: left;
  }

  h1 {
    color: #06faa4;
    margin-bottom: 15px;
  }

  .curso {
    background: #1b074d;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
  }

  .titulo {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: bold;
    color: white;
    margin-bottom: 5px;
  }

  .descricao {
    color: #ccc;
    margin: 10px 0;
  }

  button.entrar {
    padding: 6px 12px;
    font-size: 14px;
    font-weight: bold;
    width: 25%;
    min-width: 80px;
    background: #06faa4;
    color: #120532;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }

  button.entrar:hover {
    background: #05e295;
    transform: translateY(-2px);
  }

  #logout {
    padding: 8px 12px;
    font-size: 14px;
    font-weight: bold;
    background: #06faa4;
    color: #120532;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.3s, transform 0.2s;
  }

  #logout:hover {
    background: #05e295;
    transform: translateY(-2px);
  }

  #user {
    margin-bottom: 15px;
    color: #06faa4;
  }

  /* =====================
     Responsividade Mobile
     ===================== */
  @media (max-width: 768px) {
    button.entrar { width: 50%; font-size: 15px; }
    #logout { width: 50%; font-size: 15px; }
  }

  @media (max-width: 480px) {
    body { padding: 5px; }
    h1 { font-size: 22px; }
    .titulo { font-size: 18px; }
    button.entrar { width: 100%; font-size: 16px; }
    #logout { width: 100%; font-size: 16px; }
  }
</style>
</head>

<body>

<div id="loading">Carregando...</div>

<div id="conteudo" style="display:none;" class="container">
  <h1>Nossos cursos</h1>
  <p id="user"></p>
  <div id="lista"></div>
  <button id="logout">Sair</button>
</div>

<script type="module">
import { auth, db, onAuthStateChanged } from "./firebase.js";
import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("user").innerText = "Logado como: " + user.email;

  const snapshot = await getDocs(query(collection(db, "cursos"), orderBy("ordem")));

  document.getElementById("loading").style.display = "none";
  document.getElementById("conteudo").style.display = "block";

  snapshot.forEach(doc => {
    const data = doc.data();
    const id = doc.id;

    const div = document.createElement("div");
    div.className = "curso";

    const titulo = document.createElement("div");
    titulo.className = "titulo";
    titulo.innerText = data.nome || "Sem nome";

    const descricao = document.createElement("div");
    descricao.className = "descricao";
    descricao.innerText = data.descricao || "";

    const btn = document.createElement("button");
    btn.className = "entrar";
    btn.innerText = "Entrar";

    btn.addEventListener("click", () => {
      window.location.href = `curso1.html?id=${id}`;
    });

    div.appendChild(titulo);
    div.appendChild(descricao);
    div.appendChild(btn);

    document.getElementById("lista").appendChild(div);
  });
});

document.getElementById("logout").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "index.html";
});
</script>

</body>
</html>
