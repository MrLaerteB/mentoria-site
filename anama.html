<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANAMÁ TRADING</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #120532;
    color: white;
    margin: 0;
    padding: 10px;
    text-align: left;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 10px 15px;
  }

  h1 {
    color: #06faa4;
    margin-bottom: 15px;
  }

  .filtros {
    margin-bottom: 15px;
  }

  .filtroLabel {
    color: white;
    font-style: italic;
    margin-right: 8px;
    font-size: 11px;
  }

  .tagFiltro {
    display: inline-block;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 11px;
    margin: 3px;
    cursor: pointer;
    font-style: italic;
  }

  .tagFiltro.ativa {
    outline: 2px solid white;
  }

  .curso {
    background: #1b074d;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;

    /* 🔥 separação visual */
    border-top: 3px solid #06faa4;
  }

  .titulo {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: bold;
    margin-bottom: 5px;
  }

  .descricao {
    color: #ccc;
    margin: 5px 0 10px 0;
    font-size: 12px;
  }

  .tagsWrapper {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .tag {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-style: italic;
  }

  /* cores */
  .videos { background:#ccffe6; color:#006644; }
  .dolar { background:#ffd6d6; color:#990000; }
  .ouro { background:#fff5cc; color:#8b6508; }
  .downloads { background:#5a3e1b; color:#fff5cc; }
  .comunicacao { background:#d6eaff; color:#001f4d; }
  .cursos { background:#ffd6eb; color:#cc0066; }
  .mentorias { background:#e0e0e0; color:#000; }
  .default { background:#2a0a6c; color:#06faa4; }

  /* 🔥 botão novo */
  .entrar {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    font-weight: bold;
    background: #06faa4;
    color: #120532;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  #logout {
    padding: 8px 12px;
    font-size: 14px;
    font-weight: bold;
    background: #06faa4;
    color: #120532;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
  }

  #user {
    margin-bottom: 15px;
    color: #06faa4;
  }
</style>
</head>

<body>

<div id="loading">Carregando...</div>

<div id="conteudo" style="display:none;" class="container">
  <h1>Nossos cursos</h1>
  <p id="user"></p>

  <div id="filtros" class="filtros"></div>
  <div id="lista"></div>

  <button id="logout">Sair</button>
</div>

<script type="module">
import { auth, db, onAuthStateChanged } from "./firebase.js";
import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

let cursos = [];
let filtrosAtivos = [];

function normalizar(tag){
  return tag.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"");
}

function corClasse(tag){
  const t = normalizar(tag);
  return ["videos","dolar","ouro","downloads","comunicacao","cursos","mentorias"].includes(t) ? t : "default";
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("user").innerText = "Logado como: " + user.email;

  const snapshot = await getDocs(
    query(collection(db, "cursos"), orderBy("ordem"))
  );

  snapshot.forEach(doc => {
    cursos.push({ id: doc.id, ...doc.data() });
  });

  document.getElementById("loading").style.display = "none";
  document.getElementById("conteudo").style.display = "block";

  renderFiltros();
  renderCursos();
});

function renderFiltros(){
  const set = new Set();
  cursos.forEach(c => (c.tags||[]).forEach(t => set.add(t)));

  const container = document.getElementById("filtros");
  container.innerHTML = "";

  const label = document.createElement("span");
  label.className = "filtroLabel";
  label.innerText = "Filtro:";
  container.appendChild(label);

  set.forEach(tag => {
    const el = document.createElement("span");
    el.className = "tagFiltro " + corClasse(tag);
    el.innerText = tag;

    el.onclick = () => {
      if (filtrosAtivos.includes(tag)) {
        filtrosAtivos = filtrosAtivos.filter(t => t !== tag);
      } else {
        filtrosAtivos.push(tag);
      }

      atualizarFiltrosUI();
      renderCursos();
    };

    container.appendChild(el);
  });
}

function atualizarFiltrosUI(){
  document.querySelectorAll(".tagFiltro").forEach(el=>{
    el.classList.toggle("ativa", filtrosAtivos.includes(el.innerText));
  });
}

function renderCursos(){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  cursos
  .filter(c => 
    filtrosAtivos.length === 0 || 
    filtrosAtivos.every(f => (c.tags||[]).includes(f))
  )
  .forEach(curso => {

    const div = document.createElement("div");
    div.className = "curso";

    const titulo = document.createElement("div");
    titulo.className = "titulo";
    titulo.innerText = curso.nome || "Sem nome";

    const descricao = document.createElement("div");
    descricao.className = "descricao";
    descricao.innerText = curso.descricao || "";

    const tagsWrapper = document.createElement("div");
    tagsWrapper.className = "tagsWrapper";

    (curso.tags || []).forEach(tag => {
      const t = document.createElement("span");
      t.className = "tag " + corClasse(tag);
      t.innerText = tag;
      tagsWrapper.appendChild(t);
    });

    const btn = document.createElement("button");
    btn.className = "entrar";
    btn.innerText = "Entrar ▶️";

    btn.onclick = () => {
      window.location.href = `curso1.html?id=${curso.id}`;
    };

    div.appendChild(titulo);
    div.appendChild(descricao);
    div.appendChild(tagsWrapper);
    div.appendChild(btn);

    lista.appendChild(div);
  });
}

document.getElementById("logout").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "index.html";
});
</script>

</body>
</html>
